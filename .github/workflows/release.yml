name: Build and Release Firmware

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO Core
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Build Firmware Targets
        run: |
          pio run -e esp32-c3-usb
          pio run -e esp32-c3-ota

      - name: Package Release Binaries
        run: |
          mkdir -p release_assets
          cp .pio/build/esp32-c3-usb/firmware.bin release_assets/AllskyRadarView-esp32-c3-usb.bin
          cp .pio/build/esp32-c3-ota/firmware.bin release_assets/AllskyRadarView-esp32-c3-ota.bin

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AllskyRadarView-Firmware
          path: release_assets/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          files: |
            release_assets/AllskyRadarView-esp32-c3-usb.bin
            release_assets/AllskyRadarView-esp32-c3-ota.bin
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

