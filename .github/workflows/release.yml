name: Build and Release Firmware

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: ${{ runner.os }}-platformio-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO and esptool
        run: |
          python -m pip install --upgrade pip
          pip install platformio esptool

      - name: Build Firmware Targets
        run: |
          pio run -e esp32-c3-usb
          pio run -e esp32-s3-usb

      - name: Package Firmware Binaries
        run: |
          mkdir -p release_assets

          # ESP32-C3
          BUILD_C3=".pio/build/esp32-c3-usb"
          cp "$BUILD_C3/firmware.bin" release_assets/AllskyRadarView-ESP32C3-firmware.bin
          cp "$BUILD_C3/partitions.bin" release_assets/AllskyRadarView-ESP32C3-partitions.bin
          cp "$BUILD_C3/bootloader.bin" release_assets/AllskyRadarView-ESP32C3-bootloader.bin

          python -m esptool --chip esp32c3 merge_bin \
            -o release_assets/AllskyRadarView-ESP32C3-factory-merged.bin \
            --flash_mode qio \
            --flash_freq 80m \
            --flash_size 4MB \
            0x0000 "$BUILD_C3/bootloader.bin" \
            0x8000 "$BUILD_C3/partitions.bin" \
            0x10000 "$BUILD_C3/firmware.bin"

          # ESP32-S3
          BUILD_S3=".pio/build/esp32-s3-usb"
          cp "$BUILD_S3/firmware.bin" release_assets/AllskyRadarView-ESP32S3-firmware.bin
          cp "$BUILD_S3/partitions.bin" release_assets/AllskyRadarView-ESP32S3-partitions.bin
          cp "$BUILD_S3/bootloader.bin" release_assets/AllskyRadarView-ESP32S3-bootloader.bin

          python -m esptool --chip esp32s3 merge_bin \
            -o release_assets/AllskyRadarView-ESP32S3-factory-merged.bin \
            --flash_mode qio \
            --flash_freq 80m \
            --flash_size 4MB \
            0x0000 "$BUILD_S3/bootloader.bin" \
            0x8000 "$BUILD_S3/partitions.bin" \
            0x10000 "$BUILD_S3/firmware.bin"

          ls -lh release_assets/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AllskyRadarView-Firmware
          path: release_assets/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_assets/AllskyRadarView-ESP32C3-factory-merged.bin
            release_assets/AllskyRadarView-ESP32C3-firmware.bin
            release_assets/AllskyRadarView-ESP32C3-bootloader.bin
            release_assets/AllskyRadarView-ESP32C3-partitions.bin
            release_assets/AllskyRadarView-ESP32S3-factory-merged.bin
            release_assets/AllskyRadarView-ESP32S3-firmware.bin
            release_assets/AllskyRadarView-ESP32S3-bootloader.bin
            release_assets/AllskyRadarView-ESP32S3-partitions.bin
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
