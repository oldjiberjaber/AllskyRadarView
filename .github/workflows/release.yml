name: Build & Release Firmware

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO and esptool
        run: |
          python -m pip install --upgrade pip
          pip install platformio esptool

      - name: Build Firmware (esp32-c3-usb)
        run: |
          pio run -e esp32-c3-usb

      - name: Package Firmware Binaries
        run: |
          mkdir -p release_bin
          BUILD_DIR=".pio/build/esp32-c3-usb"

          cp "$BUILD_DIR/firmware.bin" release_bin/allskyradarview-ota.bin
          cp "$BUILD_DIR/partitions.bin" release_bin/partitions.bin
          cp "$BUILD_DIR/bootloader.bin" release_bin/bootloader.bin

          # Merge into a single 0x0 flashable factory binary
          python -m esptool --chip esp32c3 merge_bin \
            -o release_bin/allskyradarview-factory-merged.bin \
            --flash_mode qio \
            --flash_freq 80m \
            --flash_size 4MB \
            0x0000 "$BUILD_DIR/bootloader.bin" \
            0x8000 "$BUILD_DIR/partitions.bin" \
            0x10000 "$BUILD_DIR/firmware.bin"

          ls -lh release_bin/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: allskyradarview-binaries
          path: release_bin/*

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: allskyradarview-binaries
          path: release_bin

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_bin/allskyradarview-factory-merged.bin
            release_bin/allskyradarview-ota.bin
            release_bin/bootloader.bin
            release_bin/partitions.bin
          generate_release_notes: true
          draft: false
          prerelease: false
