; PlatformIO Project Configuration File for AllskyRadarView
; Universal Dual & Single Display Station for ESP32-C3 & GC9B72

[platformio]
default_envs = esp32-c3-ota

[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

; Maximize CPU and Flash Performance
board_build.f_cpu = 160000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = min_spiffs.csv

monitor_port = COM13
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time, colorize

build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections

lib_deps =
    lovyan03/LovyanGFX @ ^1.2.28
    bblanchon/ArduinoJson @ ^7.0.0
    LittleFS @ ^2.0.0

; -------------------------------------------------------------
; 1. Wireless OTA Environment (Default - keeps terminal active)
; -------------------------------------------------------------
[env:esp32-c3-ota]
upload_protocol = espota
upload_port = 192.168.0.175
upload_flags =
    --port=3232

; -------------------------------------------------------------
; 2. USB-C Direct Flashing Environment (Fallback / Initial)
; -------------------------------------------------------------
[env:esp32-c3-usb]
upload_protocol = esptool
upload_port = COM13
upload_speed = 115200
upload_flags = 
    --no-stub

